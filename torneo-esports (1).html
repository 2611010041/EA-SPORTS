<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo E-Sports FC</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#6b7488;--ac:#0a8f5b;--ac2:#e8f6ef;--bd:#dde2ec;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#172033;--tx:#e8edf7;--mut:#93a0b8;--ac:#2fd08f;--ac2:#14352a;--bd:#2a3750;--warn:#fb923c}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#172033;--tx:#e8edf7;--mut:#93a0b8;--ac:#2fd08f;--ac2:#14352a;--bd:#2a3750;--warn:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
input[type=text],input[type=number],select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font-size:1rem}
input[type=text]{flex:1;min-width:0}
input[type=number]{width:56px;text-align:center}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:.95rem;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--ac2);border-radius:20px;padding:4px 6px 4px 12px;margin:3px}
.chip button{padding:0 8px;background:transparent;color:var(--mut);font-size:1.1rem}
label.opt{display:flex;gap:8px;align-items:center;margin:8px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600}
td.n{text-align:left}
tr.q td{background:var(--ac2)}
tr.q td:first-child{font-weight:700;color:var(--ac)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.m:last-child{border:0}
.m .h{text-align:right}.lb{display:inline-flex;gap:8px;align-items:center;text-align:left}.lb small{display:block;color:var(--mut)}.m .h .lb{flex-direction:row-reverse;text-align:right}
.sc{display:flex;gap:4px;align-items:center}
.done{color:var(--ac);font-weight:700}
.champ{text-align:center;font-size:1.3rem;padding:20px;border:2px solid var(--ac);border-radius:12px;background:var(--ac2)}
.warn{color:var(--warn);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>⚽ Torneo E-Sports FC</h1>
<p class="sub">Todos contra todos, ida y vuelta opcional y play-off con los 4 mejores.</p>
<div id="root"></div>
</main>

const TEAMS=Object.keys(CR);
function crest(t,h){h=h||38;return CR[t]?`<img src="${CR[t]}" alt="" style="height:${h}px;width:auto;flex:none">`:""}
const KEY="torneo_fc_v3";
let S={phase:"setup",names:[],double:null,mode:null,players:[],rounds:[],po:null};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const P=i=>S.players[i];
const lab=i=>`<span class="lb">${crest(P(i).team)}<span><b>${esc(P(i).name)}</b><small>${esc(P(i).team)}</small></span></span>`;

function addName(){const el=$("nm");const v=el.value.trim();if(!v)return;S.names.push(v);el.value="";save();render()}
function delName(i){S.names.splice(i,1);save();render()}
function opt(k,v){const t=$("nm")?$("nm").value:"";S[k]=v;save();render();if($("nm"))$("nm").value=t}

function start(){
  const n=S.names.length;if(n<2||S.double===null||!S.mode||(S.mode==="po"&&n<4))return;
  let pool=shuffle(TEAMS),teams=[];
  while(teams.length<n)teams=teams.concat(pool.length?pool:shuffle(TEAMS)),pool=shuffle(TEAMS);
  teams=teams.slice(0,n);
  S.players=S.names.map((name,i)=>({name,team:teams[i]}));
  // método del círculo
  let ids=S.players.map((_,i)=>i);if(ids.length%2)ids.push(null);
  const m=ids.length,R=[];
  for(let r=0;r<m-1;r++){
    const ms=[];
    for(let i=0;i<m/2;i++){let a=ids[i],b=ids[m-1-i];if(a===null||b===null)continue;if(r%2)[a,b]=[b,a];ms.push({h:a,a:b,hg:"",ag:""})}
    R.push({done:false,ms});
    ids=[ids[0],ids[m-1],...ids.slice(1,m-1)];
  }
  if(S.double)R.slice().forEach(r=>R.push({done:false,ms:r.ms.map(x=>({h:x.a,a:x.h,hg:"",ag:""}))}));
  S.rounds=R;S.po=null;S.phase="play";save();render();
}
function reset(){if(confirm("¿Empezar un nuevo torneo? Se borrarán los resultados.")){S={phase:"setup",names:S.names,double:S.double,mode:S.mode,players:[],rounds:[],po:null};save();render()}}

function saveRound(ri){
  const r=S.rounds[ri];
  for(let mi=0;mi<r.ms.length;mi++){
    const a=$(`r${ri}_${mi}_h`).value,b=$(`r${ri}_${mi}_a`).value;
    if(a===""||b===""){alert("Completa todos los marcadores de la jornada.");return}
  }
  r.ms.forEach((m,mi)=>{m.hg=+$(`r${ri}_${mi}_h`).value;m.ag=+$(`r${ri}_${mi}_a`).value});
  r.done=true;checkPO();save();render();
}
function editRound(ri){S.rounds[ri].done=false;S.po=null;save();render()}
function setMode(m){S.mode=m;checkPO();save();render()}

function table(){
  const t=S.players.map((p,i)=>({i,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));
  S.rounds.forEach(r=>{if(!r.done)return;r.ms.forEach(m=>{
    const H=t[m.h],A=t[m.a];H.pj++;A.pj++;H.gf+=m.hg;H.gc+=m.ag;A.gf+=m.ag;A.gc+=m.hg;
    if(m.hg>m.ag){H.g++;A.p++;H.pts+=3}else if(m.hg<m.ag){A.g++;H.p++;A.pts+=3}else{H.e++;A.e++;H.pts++;A.pts++}
  })});
  return t.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||P(a.i).name.localeCompare(P(b.i).name));
}
const leagueDone=()=>S.rounds.length>0&&S.rounds.every(r=>r.done);
const win=m=>m.hg===""||m.ag===""?null:m.hg>m.ag?m.h:m.ag>m.hg?m.a:m.pen==="h"?m.h:m.pen==="a"?m.a:null;
function checkPO(){
  if(S.mode==="po"&&S.players.length>=4&&leagueDone()&&!S.po){
    const t=table();
    S.po={s1:{h:t[0].i,a:t[3].i,hg:"",ag:"",pen:""},s2:{h:t[1].i,a:t[2].i,hg:"",ag:"",pen:""},f:null};
  }
}
function savePO(k){
  const m=S.po[k],a=$(`po_${k}_h`).value,b=$(`po_${k}_a`).value;
  if(a===""||b===""){alert("Ingresa ambos marcadores.");return}
  m.hg=+a;m.ag=+b;m.pen=$(`po_${k}_p`).value;
  if(m.hg===m.ag&&!m.pen){alert("Hay empate: elige quién gana por penales.");return}
  if(k!=="f"){
    const w1=win(S.po.s1),w2=win(S.po.s2);
    if(w1!==null&&w2!==null){const old=S.po.f;if(!old||old.h!==w1||old.a!==w2)S.po.f={h:w1,a:w2,hg:"",ag:"",pen:""}}
  }
  save();render();
}

function tableHTML(){
  const t=table(),q=S.mode==="po"?4:1;
  return `<div class="tw"><table><tr><th>#</th><th style="text-align:left">Participante</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr>`+
  t.map((x,k)=>`<tr class="${k<q?"q":""}"><td>${k+1}</td><td class="n">${lab(x.i)}</td><td>${x.pj}</td><td>${x.g}</td><td>${x.e}</td><td>${x.p}</td><td>${x.gf}</td><td>${x.gc}</td><td>${x.gf-x.gc}</td><td><b>${x.pts}</b></td></tr>`).join("")+`</table></div>`;
}
function poMatch(k,title){
  const m=S.po[k];if(!m)return `<p class="sub">${title}: esperando semifinales…</p>`;
  const done=m.hg!==""&&m.ag!=="";
  return `<div class="m"><div class="h">${lab(m.h)}</div><div class="sc"><input type="number" min="0" id="po_${k}_h" value="${m.hg}"> - <input type="number" min="0" id="po_${k}_a" value="${m.ag}"></div><div>${lab(m.a)}</div></div>
  <div class="row"><b>${title}</b><select id="po_${k}_p"><option value="">Si empatan: penales…</option><option value="h" ${m.pen==="h"?"selected":""}>Gana ${esc(P(m.h).name)}</option><option value="a" ${m.pen==="a"?"selected":""}>Gana ${esc(P(m.a).name)}</option></select><button onclick="savePO('${k}')">${done?"Actualizar":"Guardar"}</button>${done?'<span class="done">✓</span>':""}</div>`;
}

function render(){
  const R=$("root");
  if(S.phase==="setup"){
    R.innerHTML=`<div class="card"><h2>1. Participantes</h2>
    <div class="row"><input type="text" id="nm" placeholder="Nombre del jugador o equipo" onkeydown="if(event.key==='Enter')addName()"><button onclick="addName()">Agregar</button></div>
    <div style="margin-top:8px">${S.names.map((n,i)=>`<span class="chip">${esc(n)}<button onclick="delName(${i})" aria-label="Quitar">×</button></span>`).join("")||'<span class="sub">Aún no hay participantes (mínimo 2).</span>'}</div></div>
    <div class="card"><h2>2. ¿Solo ida o ida y vuelta?</h2>
    <label class="opt"><input type="radio" name="md" ${S.double===false?"checked":""} onchange="opt('double',false)"> Solo ida</label>
    <label class="opt"><input type="radio" name="md" ${S.double===true?"checked":""} onchange="opt('double',true)"> Ida y vuelta</label></div>
    ${S.double===null?"":`<div class="card"><h2>3. ¿Cómo se define al campeón?</h2>
    <label class="opt"><input type="radio" name="fm" ${S.mode==="champ"?"checked":""} onchange="opt('mode','champ')"> 🏆 El primero de la tabla es campeón</label>
    <label class="opt"><input type="radio" name="fm" ${S.mode==="po"?"checked":""} onchange="opt('mode','po')"> ⚔️ Play-off con los 4 primeros (1° vs 4° y 2° vs 3°, luego final)</label>
    ${S.mode==="po"&&S.names.length<4?'<p class="warn">El play-off requiere al menos 4 participantes.</p>':""}</div>`}
    <button onclick="start()" ${(S.names.length<2||S.double===null||!S.mode||(S.mode==="po"&&S.names.length<4))?"disabled":""}>🎲 Sortear equipos y comenzar (${S.names.length})</button>`;
    return;
  }
  const t=table(),usePO=S.mode==="po";
  let champ=null;
  if(leagueDone()){
    if(S.mode==="champ")champ=t[0].i;else if(usePO&&S.po&&S.po.f)champ=win(S.po.f);
  }
  let h=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="sub" style="margin:0">${S.players.length} participantes · ${S.double?"ida y vuelta":"solo ida"}${S.mode==="po"?" · fase final: play-off":S.mode==="champ"?" · campeón directo":""}</span><button class="sec" onclick="reset()">Nuevo torneo</button></div>`;
  if(champ!==null)h+=`<div class="champ">${crest(P(champ).team,48)}<br>🏆 Campeón: <b>${esc(P(champ).name)}</b><br><small>${esc(P(champ).team)}</small></div><br>`;
  if(leagueDone()&&!S.mode){const t4=S.players.length>=4;h+=`<div class="card"><h2>Jornadas terminadas</h2><p class="sub">¿Cómo definimos al campeón?</p><div class="row"><button onclick="setMode('po')" ${t4?"":"disabled"}>⚔️ Jugar play-off (1° vs 4° y 2° vs 3°)</button><button class="sec" onclick="setMode('champ')">🏆 El primero es campeón</button></div>${t4?"":'<p class="warn">El play-off requiere al menos 4 participantes.</p>'}</div>`}
  h+=`<div class="card"><h2>Tabla de posiciones</h2>${tableHTML()}</div>`;
  if(usePO&&S.po){
    h+=`<div class="card"><h2>Play-off</h2><p class="sub">Semifinales</p>${poMatch("s1","1° vs 4°")}<br>${poMatch("s2","2° vs 3°")}<hr style="border:0;border-top:1px solid var(--bd)"><p class="sub">Final</p>${poMatch("f","Final")}</div>`;
  }
  S.rounds.forEach((r,ri)=>{
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2>Jornada ${ri+1}${S.double&&ri>=S.rounds.length/2?" (vuelta)":""}</h2>${r.done?`<span><span class="done">✓ Jugada</span> <button class="sec" onclick="editRound(${ri})">Editar</button></span>`:`<button onclick="saveRound(${ri})">Guardar jornada</button>`}</div>`;
    r.ms.forEach((m,mi)=>{
      h+=`<div class="m"><div class="h">${lab(m.h)}</div><div class="sc"><input type="number" min="0" id="r${ri}_${mi}_h" value="${m.hg}" ${r.done?"disabled":""}> - <input type="number" min="0" id="r${ri}_${mi}_a" value="${m.ag}" ${r.done?"disabled":""}></div><div>${lab(m.a)}</div></div>`;
    });
    h+=`</div>`;
  });
  R.innerHTML=h;
}
render();
</script>
</body>
</html>
